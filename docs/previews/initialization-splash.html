<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NewLight Analysis 初始化预览</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #050b14;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    }
    .splash {
      position: relative;
      width: min(720px, 100vw);
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #071421;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .55);
    }
    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(3, 13, 25, .12), rgba(3, 13, 25, .24) 55%, rgba(3, 13, 25, .06));
    }
    .identity {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 300px;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #f5fbff;
      text-shadow: 0 2px 16px rgba(0, 0, 0, .65);
    }
    .logo {
      width: 76px;
      height: 76px;
      object-fit: contain;
      filter: drop-shadow(0 3px 12px rgba(0, 0, 0, .55));
    }
    h1 {
      margin: 12px 0 5px;
      font-size: 29px;
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 0;
      font-size: 14px;
      color: rgba(235, 248, 255, .86);
      letter-spacing: 0;
    }
    .footer {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 13px;
      height: 38px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      color: rgba(235, 248, 255, .74);
      text-shadow: 0 1px 8px rgba(0, 0, 0, .82);
    }
    .version {
      justify-self: start;
      font-size: 11px;
    }
    .status {
      justify-self: center;
      font-size: 13px;
      color: rgba(245, 251, 255, .88);
      white-space: nowrap;
    }
    .bubble-loader {
      position: relative;
      justify-self: end;
      width: 44px;
      height: 44px;
    }
    .bubble-loader span {
      position: absolute;
      left: 20px;
      top: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(241, 248, 251, .62);
      transform-origin: 2.5px 19px;
      animation: bubble-pulse 1.05s ease-in-out infinite;
    }
    .bubble-loader span:nth-child(1) { transform: rotate(0deg); animation-delay: 0s; }
    .bubble-loader span:nth-child(2) { transform: rotate(45deg); animation-delay: -.92s; }
    .bubble-loader span:nth-child(3) { transform: rotate(90deg); animation-delay: -.79s; }
    .bubble-loader span:nth-child(4) { transform: rotate(135deg); animation-delay: -.66s; }
    .bubble-loader span:nth-child(5) { transform: rotate(180deg); animation-delay: -.53s; }
    .bubble-loader span:nth-child(6) { transform: rotate(225deg); animation-delay: -.40s; }
    .bubble-loader span:nth-child(7) { transform: rotate(270deg); animation-delay: -.27s; }
    .bubble-loader span:nth-child(8) { transform: rotate(315deg); animation-delay: -.14s; }
    @keyframes bubble-pulse {
      0%, 100% { width: 4px; height: 4px; opacity: .34; }
      45% { width: 9px; height: 9px; opacity: 1; }
    }
    @media (max-width: 600px) {
      .identity { left: 42%; width: 250px; transform: translate(-50%, -50%) scale(.82); }
      .footer { left: 14px; right: 14px; bottom: 8px; }
      .status { font-size: 11px; }
      .bubble-loader { transform: scale(.82); transform-origin: right center; }
    }
  </style>
</head>
<body>
  <main class="splash" aria-label="NewLight Analysis 初始化窗口预览">
    <img class="background" src="../../neural_starlight_startup.gif" alt="神经星光动画背景">
    <div class="shade"></div>
    <section class="identity">
      <img class="logo" src="initialization-splash-logo.png" alt="NewLight Analysis 软件标志">
      <h1>NewLight Analysis</h1>
      <p class="subtitle">神经影像分析平台</p>
    </section>
    <footer class="footer" aria-live="polite">
      <div class="version">Version 1.0</div>
      <div class="status" id="status">正在检测运行环境...</div>
      <div class="bubble-loader" aria-label="正在加载">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
    </footer>
  </main>
  <script>
    const messages = [
      "正在检测运行环境...",
      "正在验证分析后端...",
      "正在检测图形设备...",
      "正在检查 CUDA 状态..."
    ];
    const status = document.getElementById("status");
    let index = 0;
    setInterval(() => {
      index = (index + 1) % messages.length;
      status.textContent = messages[index];
    }, 1800);
  </script>
</body>
</html>
